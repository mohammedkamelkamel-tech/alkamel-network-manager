name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o alkamel-network-manager-complete-v2-fixed.zip -d project

      - name: Export extracted source
        run: |
          cd project
          zip -qr ../alkamel-source-extracted.zip .
        shell: bash

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-source-extracted
          path: alkamel-source-extracted.zip

      - name: Find project root
        run: |
          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-network-manager-apk
          path: |
            project/**/build/outputs/apk/debug/*.apk
