name: Export Project Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          rm -rf project
          mkdir project
          unzip -o alkamel-network-manager-complete-v2-fixed.zip -d project
          cd project
          zip -qr ../alkamel-project-source.zip .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-project-source
          path: alkamel-project-source.zip
